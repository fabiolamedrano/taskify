<a href="{% url url_name %}" {% if nav_section == name %}aria-current="page"{% endif %}
   class="flex items-center gap-3 rounded-2xl px-4 py-2.5 text-sm font-medium transition {% if nav_section == name %}bg-brand-700 text-white shadow-sm{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
  <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if icon == 'dashboard' %}
      <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
      <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
    {% elif icon == 'projects' %}
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>
    {% elif icon == 'tasks' %}
      <path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>
    {% elif icon == 'teams' %}
      <circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 4 6"/>
    {% elif icon == 'time' %}
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    {% elif icon == 'users' %}
      <circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>
    {% elif icon == 'tags' %}
      <path d="M3 4a1 1 0 0 1 1-1h7.5a1 1 0 0 1 .7.3l8.5 8.5a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L3.3 12.2A1 1 0 0 1 3 11.5V4Z"/><circle cx="8" cy="8" r="1.5"/>
    {% endif %}
  </svg>
  {{ label }}
</a>
