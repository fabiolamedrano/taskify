{% extends 'base.html' %}

{% block content %}
<main class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <a href="/" class="mb-6 flex items-center justify-center gap-3">
      <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-700 text-white">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>
      </span>
      <span class="text-2xl font-bold tracking-tight">Taskify</span>
    </a>
    <div class="rounded-3xl border border-line/70 bg-white p-6 shadow-sm sm:p-8">
      {% block auth_content %}{% endblock %}
    </div>
    {% block auth_footer %}{% endblock %}
  </div>
</main>
{% endblock %}
