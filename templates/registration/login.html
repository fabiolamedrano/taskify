{% extends 'base.html' %}

{% block title %}Iniciar sesión · Taskify{% endblock %}

{% block content %}
<main class="flex min-h-screen items-center justify-center px-4">
  <div class="w-full max-w-sm rounded-2xl border border-line bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold">Taskify</h1>
    <p class="mt-1 text-sm text-muted">Inicia sesión para continuar</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}

      {% if form.errors %}
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">
          Usuario o contraseña incorrectos.
        </p>
      {% endif %}

      <div>
        <label for="id_username" class="block text-sm font-medium">Usuario</label>
        <input type="text" name="username" id="id_username" required autofocus
               autocomplete="username"
               class="mt-1 w-full rounded-lg border border-line px-3 py-2 focus:border-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-700/20">
      </div>

      <div>
        <label for="id_password" class="block text-sm font-medium">Contraseña</label>
        <input type="password" name="password" id="id_password" required
               autocomplete="current-password"
               class="mt-1 w-full rounded-lg border border-line px-3 py-2 focus:border-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-700/20">
      </div>

      <input type="hidden" name="next" value="{{ next }}">

      <button type="submit"
              class="w-full rounded-lg bg-brand-700 py-2.5 font-semibold text-white hover:bg-brand-800">
        Entrar
      </button>
    </form>
  </div>
</main>
{% endblock %}
