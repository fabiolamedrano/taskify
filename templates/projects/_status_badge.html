<span class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-semibold
  {% if status == 'active' %}bg-teal-100 text-teal-800
  {% elif status == 'paused' %}bg-amber-100 text-amber-800
  {% elif status == 'completed' %}bg-line text-ink
  {% else %}bg-red-100 text-red-800{% endif %}">{{ label }}</span>
